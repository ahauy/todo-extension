<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Todo Extension</title>
    <style>
      /* Nền dự phòng TĨNH, không phụ thuộc bundle JS/CSS: `color-scheme: light dark`
         khiến canvas UA tô đen tuyền khi OS dark, nên nếu JS chết thì popup phải
         vẫn có nền mang màu --bg (light #F5F6F7 / dark #14171A). */
      html,
      body {
        background: #f5f6f7;
      }
      body {
        margin: 0;
        width: 360px;
        height: 600px;
        overflow: hidden;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #14171a;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
