<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Hạt khảm vỏ trứng — tile nền 128×128</title>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.55" intercept="0"/>
      </feComponentTransfer>
    </filter>
    <filter id="shard" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="3" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="128" height="128" fill="#2b1b12" filter="url(#grain)" opacity="0.5"/>
  <g filter="url(#shard)" fill="#fffaf0" opacity="0.75">
    <path d="M14 20l9-4 6 7-5 8-9-2z"/>
    <path d="M62 8l7 3-1 8-8 1-2-7z"/>
    <path d="M104 26l8 5-3 8-9-1-1-8z"/>
    <path d="M33 62l10-3 4 8-7 6-8-4z"/>
    <path d="M84 58l7 4-2 8-8 2-3-8z"/>
    <path d="M18 100l8-5 7 6-4 8-9-1z"/>
    <path d="M64 96l9 2 1 9-9 3-4-8z"/>
    <path d="M108 104l7 4-2 8-8 1-2-8z"/>
  </g>
  <g filter="url(#shard)" fill="#5a3a26" opacity="0.35">
    <path d="M46 34l6-2 3 5-5 4-5-3z"/>
    <path d="M96 78l5 3-1 6-6 1-2-6z"/>
    <path d="M8 74l5 2v6l-6 2-2-6z"/>
    <path d="M52 118l6-2 3 5-5 4-5-3z"/>
  </g>
</svg>